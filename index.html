<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        font-family: 'Press Start 2P', monospace;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: auto;
      }

      #face-input {
        display: none;
      }

      #camera-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 16, 0.78);
      }

      #camera-overlay[hidden] {
        display: none;
      }

      #camera-card {
        width: min(560px, calc(100vw - 32px));
        padding: 20px;
        background: #152031;
        border: 2px solid #314155;
        color: #e8eef5;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #camera-card h2 {
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8fa3b8;
      }

      #camera-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background: #0b121c;
        border: 1px solid #3a5168;
      }

      #camera-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #0b121c;
      }

      #camera-guide {
        position: absolute;
        inset: 12%;
        border: 2px dashed rgba(125, 186, 90, 0.7);
        border-radius: 50%;
        pointer-events: none;
      }

      #camera-actions {
        display: flex;
        gap: 10px;
      }

      #camera-overlay button {
        appearance: none;
        border: 1px solid #4a617a;
        background: #243447;
        color: #e8eef5;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px 14px;
        cursor: pointer;
        flex: 1;
      }

      #camera-overlay button:hover {
        background: #314a63;
      }

      #camera-capture-btn {
        background: #7dba5a !important;
        border-color: #7dba5a !important;
        color: #0b0f14 !important;
      }

      #camera-capture-btn:hover {
        background: #93d06d !important;
      }

      #camera-error {
        min-height: 1.2em;
        font-size: 12px;
        color: #e08a8a;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <input id="face-input" type="file" accept="image/*" />

    <div id="camera-overlay" hidden>
      <div id="camera-card">
        <h2>Take a selfie</h2>
        <div id="camera-frame">
          <video id="camera-video" playsinline autoplay muted></video>
          <div id="camera-guide"></div>
        </div>
        <div id="camera-actions">
          <button type="button" id="camera-capture-btn">Snap photo</button>
          <button type="button" id="camera-cancel-btn">Cancel</button>
        </div>
        <div id="camera-error"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
