<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undead Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120608;
        font-family: 'Press Start 2P', monospace;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: auto;
      }

      #face-input {
        display: none;
      }

      #camera-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 4, 6, 0.86);
      }

      #camera-overlay[hidden] {
        display: none;
      }

      #camera-card {
        width: min(560px, calc(100vw - 32px));
        padding: 20px;
        background: #1a080a;
        border: 3px solid #8b1c1c;
        box-shadow: inset 0 0 0 2px rgba(232, 184, 74, 0.35);
        color: #ffe8e0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #camera-card h2 {
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #e8b84a;
      }

      #camera-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background: #0a0203;
        border: 1px solid #5a1818;
      }

      #camera-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #0a0203;
      }

      #camera-guide {
        position: absolute;
        inset: 12%;
        border: 2px dashed rgba(232, 184, 74, 0.7);
        border-radius: 50%;
        pointer-events: none;
      }

      #camera-actions {
        display: flex;
        gap: 10px;
      }

      #camera-overlay button {
        appearance: none;
        border: 1px solid #5a2424;
        background: #3a1818;
        color: #ffe8e0;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px 14px;
        cursor: pointer;
        flex: 1;
      }

      #camera-overlay button:hover {
        background: #5a2424;
      }

      #camera-capture-btn {
        background: #c42828 !important;
        border-color: #c42828 !important;
        color: #fff5f0 !important;
      }

      #camera-capture-btn:hover {
        background: #e03939 !important;
      }

      #camera-error {
        min-height: 1.2em;
        font-size: 12px;
        color: #ff6a6a;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <input id="face-input" type="file" accept="image/*" />

    <div id="camera-overlay" hidden>
      <div id="camera-card">
        <h2>Take a selfie</h2>
        <div id="camera-frame">
          <video id="camera-video" playsinline autoplay muted></video>
          <div id="camera-guide"></div>
        </div>
        <div id="camera-actions">
          <button type="button" id="camera-capture-btn">Snap photo</button>
          <button type="button" id="camera-cancel-btn">Cancel</button>
        </div>
        <div id="camera-error"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
