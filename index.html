<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undead Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120608;
        font-family: 'Press Start 2P', monospace;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: auto;
      }

      #face-input {
        display: none;
      }

      #camera-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 4, 6, 0.86);
      }

      #camera-overlay[hidden] {
        display: none;
      }

      #camera-card {
        width: min(560px, calc(100vw - 32px));
        padding: 20px;
        background: #1a080a;
        border: 3px solid #8b1c1c;
        box-shadow: inset 0 0 0 2px rgba(232, 184, 74, 0.35);
        color: #ffe8e0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #camera-card h2 {
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #e8b84a;
      }

      #camera-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background: #0a0203;
        border: 1px solid #5a1818;
      }

      #camera-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #0a0203;
      }

      #camera-guide {
        position: absolute;
        inset: 12%;
        border: 2px dashed rgba(232, 184, 74, 0.7);
        border-radius: 50%;
        pointer-events: none;
      }

      #camera-actions {
        display: flex;
        gap: 10px;
      }

      #camera-overlay button {
        appearance: none;
        border: 1px solid #5a2424;
        background: #3a1818;
        color: #ffe8e0;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px 14px;
        cursor: pointer;
        flex: 1;
      }

      #camera-overlay button:hover {
        background: #5a2424;
      }

      #camera-capture-btn {
        background: #c42828 !important;
        border-color: #c42828 !important;
        color: #fff5f0 !important;
      }

      #camera-capture-btn:hover {
        background: #e03939 !important;
      }

      #camera-error {
        min-height: 1.2em;
        font-size: 12px;
        color: #ff6a6a;
      }

      #death-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 16, 24, 0.88);
      }

      #death-overlay[hidden] {
        display: none;
      }

      #death-card {
        width: min(420px, calc(100vw - 32px));
        padding: 24px 20px;
        background: #152031;
        border: 2px solid #5a3030;
        box-shadow: 0 0 0 1px rgba(94, 200, 255, 0.15);
        color: #e8eef5;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }

      #death-card h2 {
        font-size: 18px;
        color: #e08a8a;
        letter-spacing: 0.08em;
      }

      #death-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 16px;
        font-size: 10px;
        color: #8fa3b8;
        text-align: left;
      }

      #death-stats dt {
        color: #6a7d92;
      }

      #death-stats dd {
        color: #c8d4e0;
        text-align: right;
      }

      #death-name-label {
        font-size: 10px;
        color: #8fa3b8;
        text-align: left;
      }

      #death-name-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #314155;
        background: #0b1018;
        color: #e8eef5;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
      }

      #death-name-input:focus {
        outline: none;
        border-color: #5ec8ff;
      }

      #death-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #death-overlay button {
        appearance: none;
        border: 1px solid #314155;
        background: #243447;
        color: #e8eef5;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 12px 14px;
        cursor: pointer;
      }

      #death-overlay button:hover:not(:disabled) {
        background: #314a63;
      }

      #death-overlay button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #death-save-btn {
        background: #5ec8ff !important;
        border-color: #5ec8ff !important;
        color: #0b0f14 !important;
      }

      #death-save-btn:hover:not(:disabled) {
        background: #8ad8ff !important;
      }

      #death-restart-btn {
        background: #7dba5a !important;
        border-color: #7dba5a !important;
        color: #0b0f14 !important;
      }

      #death-restart-btn:hover {
        background: #93d06d !important;
      }

      #death-status {
        min-height: 1.2em;
        font-size: 10px;
        color: #8fa3b8;
      }

      #highscores-overlay {
        position: fixed;
        inset: 0;
        z-index: 45;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 4, 6, 0.9);
      }

      #highscores-overlay[hidden] {
        display: none;
      }

      #highscores-card {
        width: min(480px, calc(100vw - 32px));
        padding: 22px 18px;
        background: #1a080a;
        border: 3px solid #8b1c1c;
        box-shadow: inset 0 0 0 2px rgba(232, 184, 74, 0.35);
        color: #ffe8e0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #highscores-card h2 {
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #e8b84a;
        text-align: center;
      }

      #highscores-table-wrap {
        overflow-x: auto;
      }

      #highscores-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 9px;
      }

      #highscores-table th {
        color: #e8b84a;
        text-align: left;
        padding: 6px 4px;
        border-bottom: 1px solid #5a1818;
      }

      #highscores-table td {
        padding: 6px 4px;
        color: #ffe8e0;
        border-bottom: 1px solid rgba(90, 24, 24, 0.5);
      }

      #highscores-table th:nth-child(1),
      #highscores-table td:nth-child(1) {
        width: 28px;
        text-align: center;
      }

      #highscores-table th:nth-child(3),
      #highscores-table td:nth-child(3),
      #highscores-table th:nth-child(4),
      #highscores-table td:nth-child(4),
      #highscores-table th:nth-child(5),
      #highscores-table td:nth-child(5) {
        text-align: right;
      }

      #highscores-overlay button {
        appearance: none;
        border: 1px solid #5a2424;
        background: #3a1818;
        color: #ffe8e0;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }

      #highscores-overlay button:hover {
        background: #5a2424;
      }

      #highscores-status {
        min-height: 1.2em;
        font-size: 10px;
        color: #c49a9a;
        text-align: center;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <input id="face-input" type="file" accept="image/*" />

    <div id="camera-overlay" hidden>
      <div id="camera-card">
        <h2>Take a selfie</h2>
        <div id="camera-frame">
          <video id="camera-video" playsinline autoplay muted></video>
          <div id="camera-guide"></div>
        </div>
        <div id="camera-actions">
          <button type="button" id="camera-capture-btn">Snap photo</button>
          <button type="button" id="camera-cancel-btn">Cancel</button>
        </div>
        <div id="camera-error"></div>
      </div>
    </div>

    <div id="death-overlay" hidden>
      <div id="death-card">
        <h2>YOU DIED</h2>
        <dl id="death-stats">
          <dt>Survived</dt>
          <dd id="death-survival">00:00</dd>
          <dt>Levels cleared</dt>
          <dd id="death-levels">0</dd>
          <dt>Kills</dt>
          <dd id="death-kills">0</dd>
          <dt>Coins</dt>
          <dd id="death-coins">0</dd>
        </dl>
        <label id="death-name-label" for="death-name-input">Player name</label>
        <input
          id="death-name-input"
          type="text"
          maxlength="32"
          placeholder="Your name"
          autocomplete="nickname"
        />
        <div id="death-actions">
          <button type="button" id="death-save-btn">SAVE RUN</button>
          <button type="button" id="death-restart-btn">RESTART</button>
          <button type="button" id="death-menu-btn">MAIN MENU</button>
        </div>
        <div id="death-status"></div>
      </div>
    </div>

    <div id="highscores-overlay" hidden>
      <div id="highscores-card">
        <h2>High Scores</h2>
        <div id="highscores-table-wrap">
          <table id="highscores-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Time</th>
                <th>Lvls</th>
                <th>Kills</th>
              </tr>
            </thead>
            <tbody id="highscores-list"></tbody>
          </table>
        </div>
        <div id="highscores-status"></div>
        <button type="button" id="highscores-close-btn">CLOSE</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
